rule-providers:
  direct:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/qianye9998/clash-rules-simple/main/rules/direct.yaml
    path: ./ruleset/simple/direct.yaml
    interval: 86400
  proxy:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/qianye9998/clash-rules-simple/main/rules/proxy.yaml
    path: ./ruleset/simple/proxy.yaml
    interval: 86400
  reject:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/qianye9998/clash-rules-simple/main/rules/reject.yaml
    path: ./ruleset/simple/reject.yaml
    interval: 86400

rules:
  - DOMAIN,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - RULE-SET,reject,REJECT
  - RULE-SET,proxy,PROXY
  - RULE-SET,direct,DIRECT
  - MATCH,PROXY
